---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: retrieval-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ai-lab
      app.kubernetes.io/component: retrieval
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: ai-lab
