---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metadata-telemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ai-lab
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: otel-collector
    ports:
    - port: 4317
      protocol: TCP
    - port: 4318
      protocol: TCP
